<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>99乘法表游戏</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- 开始界面 -->
        <div id="start-screen" class="screen active">
            <h1>99乘法表游戏 -- 送给Meg</h1>
            <p>选择题目类型</p>
            <div class="question-type-options">
                <button class="type-btn active" data-type="multiplication">乘法</button>
                <button class="type-btn" data-type="division">除法</button>
                <button class="type-btn" data-type="mixed">混合</button>
            </div>
            <p>选择题目数量开始练习</p>
            <div class="question-count-options">
                <button class="count-btn" data-count="10">10题</button>
                <button class="count-btn" data-count="20">20题</button>
                <button class="count-btn" data-count="50">50题</button>
                <button class="count-btn" data-count="100">100题</button>
            </div>
        </div>

        <!-- 游戏界面 -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <div class="progress">
                    <span id="current-question">1</span> / <span id="total-questions">10</span>
                </div>
                <div class="score-info">
                    <span>得分: <span id="current-score">0</span></span>
                    <span>正确率: <span id="accuracy">0%</span></span>
                </div>
            </div>
            
            <div class="question-container">
                <div id="question-text" class="question">3 × 7 = ?</div>
                <div class="answer-options">
                    <button class="answer-btn" data-answer="0">21</button>
                    <button class="answer-btn" data-answer="1">18</button>
                    <button class="answer-btn" data-answer="2">24</button>
                    <button class="answer-btn" data-answer="3">20</button>
                </div>
            </div>
        </div>

        <!-- 结果界面 -->
        <div id="result-screen" class="screen">
            <h2>游戏结束！</h2>
            <div class="result-stats">
                <div class="stat-item">
                    <span class="stat-label">最终得分:</span>
                    <span id="final-score" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">正确率:</span>
                    <span id="final-accuracy" class="stat-value">0%</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">答对题数:</span>
                    <span id="correct-count" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">答错题数:</span>
                    <span id="incorrect-count" class="stat-value">0</span>
                </div>
            </div>
            <button id="restart-btn" class="restart-button">再来一次</button>
        </div>
    </div>

    <script src="js/QuestionGenerator.js"></script>
    <script src="js/ScoreManager.js"></script>
    <script src="js/UIRenderer.js"></script>
    <script src="js/GameController.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
